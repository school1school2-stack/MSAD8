<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أ. مساعد السعدان - ثانوية الأمير عبدالمجيد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { 
            --royal-blue: #1e3a8a; --q-red: #ef4444; --bg-page: #f8fafc; 
            --success-green: #10b981; --k-purple: #7c3aed; --card-border: #e2e8f0;
            --text-color: #1e293b; --card-bg: #ffffff;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-page); color: var(--text-color); margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; line-height: 1.6;
            box-sizing: border-box;
        }
        .user-header {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 5px solid var(--royal-blue); 
            margin-bottom: 20px; box-sizing: border-box; gap: 15px; flex-wrap: wrap;
        }
        .user-name { margin: 0; color: var(--royal-blue); font-weight: bold; font-size: 1.3rem; }
        .school-name { margin: 0; color: #64748b; font-weight: bold; font-size: 0.95rem; }
        .logo-box { background: var(--royal-blue); width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.4rem; }
        .top-action-bar {
            width: 100%; max-width: 850px; background: #1e293b; border-radius: 15px; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px; box-sizing: border-box; gap: 12px; flex-wrap: wrap;
        }
        .btn { border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; color: white; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; font-size: 0.9rem; }
        .array-import-box {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px dashed #0284c7; margin-bottom: 25px; box-sizing: border-box;
        }
        .array-textarea {
            width: 100%; height: 180px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px;
            font-family: monospace; font-size: 0.85rem; direction: ltr; text-align: left; outline: none; box-sizing: border-box; margin-bottom: 10px;
        }
        .auth-card {
            background: var(--card-bg); width: 100%; max-width: 850px; border-radius: 20px; padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; margin-bottom: 25px;
        }
        .auth-input { width: 80%; max-width: 400px; padding: 15px; border-radius: 10px; border: 2px solid #cbd5e1; margin-bottom: 15px; text-align: center; font-size: 1.1rem; outline: none; }
        .container { width: 100%; max-width: 850px; padding-bottom: 120px; display: none; box-sizing: border-box; }
        .question-card { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 2px solid var(--card-border); position: relative; text-align: right; }
        .question-card::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: var(--k-purple); border-radius: 0 10px 10px 0; }
        .q-number-badge { background: var(--k-purple); color: white; padding: 4px 15px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; }
        .q-text-input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 12px; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; text-align: right; background: rgba(0,0,0,0.02); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .opt-pair-row { display: flex; align-items: center; background: var(--card-bg); border: 1.5px solid #d1d5db; border-radius: 10px; padding: 12px; cursor: pointer; gap: 8px; }
        .opt-label { font-weight: bold; color: var(--royal-blue); }
        .opt-word { width: 100%; border: none; outline: none; font-weight: bold; color: inherit; background: transparent; text-align: right; font-family: inherit; }
        body.student-mode .top-action-bar, body.student-mode .array-import-box, body.student-mode .admin-only { display: none !important; }
        body.student-mode .selected-opt { background: rgba(59, 130, 246, 0.2) !important; border: 2px solid var(--royal-blue) !important; }
    </style>
</head>
<body>

    <div class="user-header">
        <div style="flex:1; text-align:right;"><h2 class="user-name">أ. مساعد السعدان</h2></div>
        <div><div class="logo-box"><i class="fas fa-award"></i></div></div>
        <div style="flex:1; text-align:left;"><p class="school-name">ثانوية الأمير عبدالمجيد 😉</p></div>
    </div>

    <div class="top-action-bar admin-only">
        <span style="color: #38bdf8; font-weight: bold;">لوحة تحكم المعلم</span>
        <button class="btn" style="background: #10b981;" onclick="generateStudentShareCode()"><i class="fas fa-code"></i> توليد كود النشر النهائي للطلاب</button>
    </div>

    <div id="student-auth-container" style="display:none;">
        <div class="auth-card">
            <h2 style="color: var(--royal-blue); margin-top: 0;">تسجيل دخول الطالب 🎓</h2>
            <p style="color: #64748b; margin-bottom: 20px;">الرجاء إدخال إيميل منصة مدرستي المعتمد لبدء الاختبار:</p>
            <input type="email" id="studentEmailInput" class="auth-input" placeholder="sxxxxxxx@rb.moe.gov.sa">
            <br>
            <button class="btn" style="background: var(--success-green); padding: 12px 30px; font-size: 1.1rem;" onclick="verifyStudentEmail()">دخول المنصة 🚀</button>
            <p id="auth-status-msg" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <div class="array-import-box admin-only">
        <label style="display: block; font-weight: bold; color: #0284c7; margin-bottom: 8px;">ألصق مصفوفة الأسئلة هنا:</label>
        <textarea id="arrayInputText" class="array-textarea" placeholder="[ { q: 'السؤال هنا', opts: ['أ', 'ب', 'ج', 'د'], ans: 'أ' } ]"></textarea>
        <button class="btn" style="background:#0284c7; width:100%; justify-content:center;" onclick="importArrayQuestions()">توليد الأسئلة في الصفحة</button>
    </div>

    <div class="container" id="quiz-content"></div>

    <div id="student-actions" style="display: none; text-align: center; margin-bottom: 50px;">
        <button class="btn" style="background:#10b981; padding:15px 30px" onclick="gradeExam()">انتهيت.. اعتماد النتيجة وسحب الدرجة لسحاب أ. مساعد</button>
    </div>

    <script>
        // مصفوفة الأسئلة الثابتة داخل الصفحة (تضمن ظهورها فوراً للطلاب دون مشاكل سحابية في جلب النماذج)
        const embeddedExamData = [
            {
                q: "مثال على سؤال: الكفاية النحوية تعنى بدراسة...؟",
                opts: ["بنية الكلمة والجملة", "الاملاء والخط", "التعبير الكتابي", "القراءة التحليلية"],
                ans: "بنية الكلمة والجملة"
            }
        ];

        let authenticatedStudentEmail = "";
        let authenticatedStudentName = "";

        // ربط قاعدة بيانات أستاذ مساعد (msad-e258c) المخصصة لاستقبال نتائج الطلاب ولوحة الشرف
        const firebaseConfig = {
            apiKey: "AIzaSyDGftCpTmowkhQlNAgH_o7dIMtD-RKSNaM",
            authDomain: "msad-e258c.firebaseapp.com",
            projectId: "msad-e258c",
            storageBucket: "msad-e258c.firebasestorage.app",
            messagingSenderId: "680278639571",
            appId: "1:680278639571:web:4e337e1751ebe9d9e92526"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const fsDb = firebase.firestore();

        function importArrayQuestions() {
            try {
                let raw = document.getElementById('arrayInputText').value.trim();
                let parsed = eval('(' + raw + ')');
                if (Array.isArray(parsed)) {
                    renderQuestions(parsed);
                    alert("تم توليد الأسئلة بنجاح!");
                }
            } catch(e) {
                alert("تأكد من صحة كتابة المصفوفة البرمجية.");
            }
        }

        function renderQuestions(dataArr) {
            const container = document.getElementById('quiz-content');
            container.innerHTML = "";
            dataArr.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = "question-card";
                card.innerHTML = `
                    <div style="margin-bottom:10px;"><span class="q-number-badge">السؤال ${index+1}</span></div>
                    <div class="q-text-input">${item.q}</div>
                    <div class="options-grid">
                        ${item.opts.map((opt, i) => `
                            <div class="opt-pair-row" onclick="selectOpt(this)">
                                <span class="opt-label">${['أ','ب','ج','د'][i]})</span>
                                <input type="text" class="opt-word opt" readonly value="${opt}">
                            </div>
                        `).join('')}
                    </div>
                    <input type="hidden" class="hidden-correct" value="${item.ans}">
                `;
                container.appendChild(card);
            });
        }

        function selectOpt(row) {
            row.closest('.options-grid').querySelectorAll('.opt-pair-row').forEach(r => r.classList.remove('selected-opt'));
            row.classList.add('selected-opt');
        }

        function generateStudentShareCode() {
            alert("لضمان ظهور الأسئلة للطلاب 100%: ضع أسئلتك داخل مصفوفة (embeddedExamData) في الكود، واضغط نشر في GitHub Pages، وسيرى الطلاب الأسئلة فوراً مع تسجيل درجاتهم في سحاب أستاذ مساعد!");
        }

        async function verifyStudentEmail() {
            const emailInput = document.getElementById('studentEmailInput').value.trim().toLowerCase();
            const msgEl = document.getElementById('auth-status-msg');

            if (!emailInput || !emailInput.includes('@')) {
                msgEl.style.color = "var(--q-red)";
                msgEl.innerText = "الرجاء إدخال إيميل مدرستي صحيح.";
                return;
            }

            try {
                const docRef = await fsDb.collection("allowed_students").doc(emailInput).get();
                if (!docRef.exists) {
                    msgEl.style.color = "var(--q-red)";
                    msgEl.innerText = "❌ هذا الإيميل غير مسجل في قائمة طلاب المدرسة المعتمدين لدى أ. مساعد!";
                    return;
                }

                authenticatedStudentEmail = emailInput;
                authenticatedStudentName = docRef.data().name || "طالب";

                document.getElementById('student-auth-container').style.display = 'none';
                document.getElementById('quiz-content').style.display = 'block';
                document.getElementById('student-actions').style.display = 'block';

                alert(`أهلاً بك يا ${authenticatedStudentName} 🌟. يمكنك بدء الاختبار الآن.`);
            } catch (err) {
                msgEl.style.color = "var(--q-red)";
                msgEl.innerText = "حدث خطأ في الاتصال بقاعدة بيانات أستاذ مساعد.";
            }
        }

        async function gradeExam() {
            const cards = document.querySelectorAll('.question-card');
            let score = 0;
            let total = cards.length;
            let details = [];

            cards.forEach(c => {
                let selected = c.querySelector('.selected-opt .opt')?.value || "";
                let correct = c.querySelector('.hidden-correct').value;
                let qText = c.querySelector('.q-text-input').innerText;
                let isCorr = (selected.trim() === correct.trim());
                if (isCorr) score++;
                details.push({ q: qText, studentAns: selected, correctAns: correct, isCorrect: isCorr });
            });

            if (!confirm("هل أنت متأكد من اعتماد النتيجة؟")) return;

            try {
                await fsDb.collection("alkfaeat_results").add({
                    name: authenticatedStudentName,
                    email: authenticatedStudentEmail,
                    score: score,
                    total: total,
                    model_id: "اختبار الكفايات",
                    answers: details,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('student-actions').innerHTML = `
                    <div style="background:#dcfce7; color:#166534; padding:20px; border-radius:12px; font-weight:bold; border:1px solid #bbf7d0;">
                        🎉 تم اعتماد وررسال درجتك بنجاح إلى لوحة شرف أ. مساعد السعدان!<br>
                        نتيجتك: ${score} من ${total}
                    </div>
                `;
            } catch (err) {
                alert("حدث خطأ أثناء حفظ النتيجة في السحابة.");
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('exam') || window.location.protocol.includes('http')) {
                document.body.classList.add('student-mode');
                document.getElementById('student-auth-container').style.display = 'block';
            }
            renderQuestions(embeddedExamData);
        };
    </script>
</body>
</html>
